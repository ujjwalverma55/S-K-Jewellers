<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Jewellers — Login</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>SK JEWELLERS</h1>
    <p class="subtitle">Gents' Ring Manufacturing — Order &amp; Production System</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div id="errorBox"></div>
      <button type="submit" class="btn">Log In</button>
    </form>
    <!--DEMO_CREDENTIALS_BLOCK-->
  </div>
</div>
<script src="/common.js"></script>
<script>
(async function init() {
  // If already logged in, bounce straight to the right dashboard.
  try {
    const me = await api('/api/me');
    redirectForRole(me.role);
  } catch (e) { /* not logged in — show form */ }
})();

function redirectForRole(role) {
  if (role === 'OWNER') window.location.href = '/owner/';
  else if (role === 'MAKER') window.location.href = '/maker/';
  else window.location.href = '/customer/';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  errorBox.innerHTML = '';
  try {
    const user = await api('/api/login', { method: 'POST', body: { email, password } });
    redirectForRole(user.role);
  } catch (err) {
    errorBox.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
